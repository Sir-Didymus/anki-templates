<!-- Front html for the 'modern_sentence_mining' note type -->

[% extends "components/base/base.html" %]

[% block header %]
[% include "components/deck-info/deck-info.html" %]
[% endblock %]

[% block body %]
<div class="modern-sentence-mining">
  <div class="modern-sentence-mining-word">{{Word}}</div>
  <div class="modern-sentence-mining-audio">{{Word-Audio}}</div>
  <hr />
  <div class="modern-sentence-mining modern-sentence-mining-color-target-word">
    {{Sentence}}</div>
  <div class="modern-sentence-mining-audio">{{Sentence-Audio}}</div>
  {{#Image}}
    <div class="modern-sentence-mining-image">{{Image}}</div>
  {{/Image}}
  <hr />
  <div class="modern-sentence-mining-definition hidden">{{Definition}}</div>
</div>
[% endblock %]
