<!-- BEGIN JS for the 'deck-info' component -->
<script>
  // Breadcrumbs to current deck
  var deckEl = document.querySelector(".modern-deck-info");
  var subDecks = deckEl.innerHTML.split("::").filter(Boolean);
  html = [];
  subDecks.forEach((subDeck) => {
    html.push("<span class='modern-deck-info-subdeck'>" + subDeck + "</span>");
  });
  deckEl.innerHTML = html.join("&nbsp;/&nbsp;");
</script>
<!-- END JS for the 'deck-info' component -->
