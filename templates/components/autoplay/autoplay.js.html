<!-- BEGIN JS for the 'autoplay' component -->
<script>
  function autoplay() {
    var elem = document.querySelector(
      ".modern-autoplay .soundLink, .modern-autoplay .replaybutton"
    );
    if (elem) {
      elem.click();
    } else {
      setTimeout(autoplay, 50);
    }
  }

  autoplay();
</script>
<!-- END JS for the 'autoplay' component -->
